<!doctype html>
<!-- Children's accounts dashboard: reads the builder apps' saved progress on this device (same site), read-only. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>حسابات الأطفال · Tools</title>
<link rel="icon" href="../assets/logo.webp">
<link rel="stylesheet" href="dashboard.css">
<script defer src="dashboard.js"></script>
</head>
<body>
<header class="dash-header">
  <a class="dash-back" href="../index.html" aria-label="الأدوات" title="الأدوات"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
  <div class="dash-brand"><h1>حسابات الأطفال</h1><p>تقارير كل الأطفال من التطبيقات على هذا الجهاز</p></div>
  <button type="button" class="dash-icon" id="dash-lock" hidden aria-label="قفل اللوحة" title="قفل اللوحة"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 7.6-1.8M12 14v3"/></svg></button>
</header>
<main id="dash-main" class="dash-main">
  <section id="dash-gate" class="dash-gate" hidden aria-labelledby="dash-gate-title">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
    <h2 id="dash-gate-title">للمعالج فقط</h2>
    <p id="dash-gate-help">أدخل كلمة مرور المعالج لعرض تقارير الأطفال.</p>
    <form><input type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="كلمة مرور المعالج" aria-describedby="dash-gate-help dash-gate-error"><button type="submit">دخول</button></form>
    <p id="dash-gate-error" role="alert" hidden>كلمة المرور غير صحيحة.</p>
  </section>
  <section id="dash-list" class="dash-list" hidden aria-labelledby="dash-list-title">
    <div class="dash-list-head"><h2 id="dash-list-title">الأطفال</h2><span id="dash-count"></span></div>
    <input type="search" id="dash-search" placeholder="ابحث بالاسم" aria-label="البحث عن طفل بالاسم" autocomplete="off">
    <div id="dash-children" class="dash-children" role="list"></div>
    <p id="dash-empty" class="dash-empty" hidden></p>
  </section>
  <section id="dash-child" class="dash-child" hidden aria-labelledby="dash-child-name"></section>
  <noscript><p class="dash-empty">فعّل JavaScript لعرض اللوحة.</p></noscript>
</main>
</body>
</html>
